<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>VisaPilot</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container">

    <header>

        <h1>VisaPilot</h1>

        <p>Your AI Visa Assistant</p>

    </header>

    <main>

        <div id="chat-box">

        </div>

    </main>

    <div id="upload-section" style="margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 8px;">
        <h3>Upload Visa Documents</h3>
        <input type="file" id="file-input" accept=".pdf, .docx">
        <button id="upload-btn">Upload & Learn</button>
        <p id="upload-status" style="font-size: 0.9em; color: #555;"></p>
    </div>

    <footer>

        <input
                id="message-input"
                type="text"
                placeholder="Ask anything..."
        >

        <button id="send-btn">

            Send

        </button>

    </footer>

    <div id="chat-controls" style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
        <label style="font-size: 0.9em; display: flex; align-items: center; gap: 5px; cursor: pointer;">
            <input type="checkbox" id="web-search-toggle" checked>
            🌐 Enable Web Search (Real-time data)
        </label>
    </div>

</div>

<script src="/static/script.js"></script>

</body>

</html>
