<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisaPilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Special+Elite&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

<div id="app-layout">

    <!-- Sidebar Section -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" id="new-chat-btn">
                <span>+</span> New Chat
            </button>
        </div>
        <div class="chat-list-container" id="chat-list"></div>
    </aside>

    <!-- Main Application Canvas -->
    <div id="main-wrapper">
        
        <!-- Repeating Airmail Top Border -->
        <div class="airmail-border"></div>

        <div class="container">
            
            <!-- Styled Navy Envelope Header -->
            <header class="envelope-header">
                <div class="header-content">
                    <h1 class="logo-title">VisaPilot</h1>
                    
                    <!-- Decorative Flight Path -->
                    <div class="flight-path">
                        <span class="plane-icon">✈</span>
                    </div>
                    
                    <p class="logo-subtitle">YOUR AI VISA ASSISTANT</p>
                    
                </div>
            </header>

            <!-- Add inside your chat header or control panel div -->
            <button id="clear-memory-btn" class="clear-mem-btn" title="Clear chat context without deleting uploaded files">
                🧹 Clear Memory
            </button>

            <!-- Retro Dot Divider -->
            <div class="dotted-divider"></div>

            <!-- Chat Message Thread Box -->
            <main>
                <div id="chat-box"></div>
            </main>

            <!-- Passport Style Document Section -->
            <div id="upload-section">
                <div class="docs-stamp">Docs</div>
                
                <h3 class="upload-title">✈ UPLOAD VISA DOCUMENTS & ID/PASSPORT IMAGES</h3>
                <div class="upload-controls">
                    <input type="file" id="file-input" accept=".pdf, .docx, .png, .jpg, .jpeg, .webp">
                    <button id="upload-btn">Upload & Analyze</button>
                    <button id="clear-docs-btn">Clear All Files</button>
                </div>
                <p id="upload-status"></p>
            </div>

            <!-- Retro Dot Divider -->
            <div class="dotted-divider"></div>

            <!-- Submission Area -->
            <footer>
                <textarea 
                    id="message-input" 
                    placeholder="Ask anything..." 
                    rows="1"
                ></textarea>
                <button id="send-btn">✈ Send</button>
            </footer>

            <div id="chat-controls">
                <label class="search-toggle-label">
                    <input type="checkbox" id="web-search-toggle" checked>
                    <span>Enable Intelligent Web Search</span>
                </label>
            </div>

        </div>
    </div>

</div>

<script src="/static/script.js"></script>
</body>

</html>
